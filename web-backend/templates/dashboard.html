{{template "base.html" .}}
{{define "content"}}
<h3 class="mb-4">仪表盘</h3>
<div class="row g-3 mb-4">
    <div class="col-md-3">
        <div class="card card-stat p-3">
            <small class="text-muted">总用户</small>
            <div class="value">{{.totalUsers}}</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card card-stat p-3">
            <small class="text-muted">启用用户</small>
            <div class="value text-success">{{.activeUsers}}</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card card-stat p-3">
            <small class="text-muted">在线用户</small>
            <div class="value text-primary">{{.onlineUsers}}</div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card card-stat p-3">
            <small class="text-muted">出站数量</small>
            <div class="value text-warning">{{.outboundCount}}</div>
        </div>
    </div>
</div>
<div class="row g-3">
    <div class="col-md-6">
        <div class="card card-stat p-3">
            <small class="text-muted">总下载流量</small>
            <div class="value">{{.totalDown}}</div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card card-stat p-3">
            <small class="text-muted">总上传流量</small>
            <div class="value">{{.totalUp}}</div>
        </div>
    </div>
</div>
<div class="mt-4">
    <button class="btn btn-primary" hx-post="/api/reload" hx-swap="none">重载配置</button>
</div>
{{end}}
