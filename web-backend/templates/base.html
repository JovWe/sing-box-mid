<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { background: #f5f7fa; font-family: 'Segoe UI', system-ui, sans-serif; }
        .sidebar { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #fff; }
        .sidebar .nav-link { color: rgba(255,255,255,.7); border-radius: 8px; margin: 2px 8px; padding: 10px 16px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { color: #fff; background: rgba(255,255,255,.1); }
        .sidebar .nav-link i { margin-right: 8px; }
        .card-stat { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
        .card-stat .value { font-size: 2rem; font-weight: 700; }
        .badge-protocol { font-size: .75rem; }
        .table-card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06); }
        .loading { opacity: .5; pointer-events: none; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-md-block sidebar p-0">
            <div class="p-3 text-center border-bottom border-secondary">
                <h5 class="mb-0">Sing-box Manager</h5>
                <small class="text-muted">中转站管理系统</small>
            </div>
            <ul class="nav flex-column mt-3">
                <li class="nav-item">
                    <a class="nav-link" href="/dashboard" hx-get="/dashboard" hx-target="#main-content" hx-push-url="true">
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/users" hx-get="/users" hx-target="#main-content" hx-push-url="true">
                        Users
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/outbounds" hx-get="/outbounds" hx-target="#main-content" hx-push-url="true">
                        Outbounds
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/traffic" hx-get="/traffic" hx-target="#main-content" hx-push-url="true">
                        Traffic
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/settings" hx-get="/settings" hx-target="#main-content" hx-push-url="true">
                        Settings
                    </a>
                </li>
            </ul>
        </nav>
        <main class="col-md-10 ms-sm-auto px-4 py-4" id="main-content">
            {{template "content" .}}
        </main>
    </div>
</div>
<script>
    document.addEventListener('htmx:afterSettle', function() {
        // Highlight active nav link
        document.querySelectorAll('.sidebar .nav-link').forEach(function(link) {
            link.classList.remove('active');
            if (link.getAttribute('href') === window.location.pathname) {
                link.classList.add('active');
            }
        });
    });
</script>
</body>
</html>
