{{template "base.html" .}}
{{define "content"}}
<h3 class="mb-4">用户管理</h3>
<div class="card table-card">
    <div class="card-body">
        <div class="d-flex justify-content-between mb-3">
            <h5 class="card-title mb-0">用户列表</h5>
            <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#addUserModal">添加用户</button>
        </div>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>用户名</th><th>协议</th><th>端口</th><th>状态</th><th>到期</th><th>流量(已用/总量)</th><th>在线</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="user-table-body">
                    {{range .users}}
                    <tr>
                        <td><strong>{{.Username}}</strong></td>
                        <td><span class="badge bg-info">{{.Protocol}}</span></td>
                        <td>{{.Port}}</td>
                        <td>{{.StatusBadge}}</td>
                        <td>{{.ExpireAt}}</td>
                        <td>{{.Used}} / {{.Limit}}</td>
                        <td>{{.Online}}</td>
                        <td>
                            <button class="btn btn-outline-info btn-sm" hx-get="/api/users/{{.Username}}/config" hx-target="#config-modal-body" data-bs-toggle="modal" data-bs-target="#configModal">配置</button>
                            <button class="btn btn-outline-danger btn-sm" hx-delete="/api/users/{{.Username}}" hx-confirm="确认删除?" hx-target="closest tr" hx-swap="outerHTML">删除</button>
                        </td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Add User Modal -->
<div class="modal fade" id="addUserModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">添加用户</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form hx-post="/api/users" hx-target="#user-table-body" hx-swap="innerHTML">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">用户名</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">协议</label>
                        <select name="protocol" class="form-select" required>
                            <option value="vless-reality">VLESS + Reality</option>
                            <option value="hysteria2">Hysteria2</option>
                            <option value="tuic">TUIC v5</option>
                            <option value="anytls">AnyTLS</option>
                            <option value="shadowtls">ShadowTLS v3</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">到期天数</label>
                        <input type="number" name="expire_days" class="form-control" value="30">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">流量限制</label>
                        <select name="traffic_limit" class="form-select">
                            <option value="100GB">100 GB</option>
                            <option value="300GB">300 GB</option>
                            <option value="500GB">500 GB</option>
                            <option value="1TB">1 TB</option>
                            <option value="0">无限制</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">创建</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Config Modal -->
<div class="modal fade" id="configModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">客户端配置</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="config-modal-body">
                <p>加载中...</p>
            </div>
        </div>
    </div>
</div>
{{end}}
