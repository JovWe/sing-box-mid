<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        body { background: #f5f7fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { width: 100%; max-width: 400px; border: none; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.1); }
        .login-header { background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); color: #fff; border-radius: 16px 16px 0 0; padding: 2rem; text-align: center; }
    </style>
</head>
<body>
<div class="login-card card">
    <div class="login-header">
        <h4>Sing-box Manager</h4>
        <small class="opacity-75">中转站管理系统</small>
    </div>
    <div class="card-body p-4">
        <form hx-post="/api/login" hx-target="#login-error" hx-swap="innerHTML">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control" placeholder="admin" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div id="login-error" class="mb-3"></div>
            <button type="submit" class="btn btn-primary w-100">登录</button>
        </form>
    </div>
</div>
</body>
</html>
