{{template "base.html" .}}
{{define "content"}}
<h3 class="mb-4">流量统计</h3>
<div class="row g-3 mb-4">
    <div class="col-md-4">
        <div class="card card-stat p-3">
            <small class="text-muted">总下载</small>
            <div class="value">{{.totalDown}}</div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card card-stat p-3">
            <small class="text-muted">总上传</small>
            <div class="value">{{.totalUp}}</div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card card-stat p-3">
            <small class="text-muted">总计</small>
            <div class="value">{{.total}}</div>
        </div>
    </div>
</div>
<div class="card table-card">
    <div class="card-body">
        <h5 class="card-title">用户流量</h5>
        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr><th>用户名</th><th>下载</th><th>上传</th><th>总计</th><th>限制</th></tr>
                </thead>
                <tbody>
                    {{range .traffics}}
                    <tr>
                        <td><strong>{{.Username}}</strong></td>
                        <td class="text-primary">{{.Down}}</td>
                        <td class="text-success">{{.Up}}</td>
                        <td><strong>{{.Total}}</strong></td>
                        <td class="text-muted">{{.Limit}}</td>
                    </tr>
                    {{end}}
                </tbody>
            </table>
        </div>
    </div>
</div>
{{end}}
