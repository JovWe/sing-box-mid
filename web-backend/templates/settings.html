{{template "base.html" .}}
{{define "content"}}
<h3 class="mb-4">系统设置</h3>
<div class="card table-card">
    <div class="card-body">
        <h5 class="card-title">基本设置</h5>
        <table class="table">
            <tr><td class="text-muted" style="width:200px">域名</td><td>{{.settings.Domain}}</td></tr>
            <tr><td class="text-muted">Web 端口</td><td>{{.settings.WebPort}}</td></tr>
            <tr><td class="text-muted">安装协议</td><td>{{range .settings.InstalledProtocols}}<span class="badge bg-info me-1">{{.}}</span>{{end}}</td></tr>
            <tr><td class="text-muted">安装时间</td><td>{{.settings.InstalledAt}}</td></tr>
        </table>
    </div>
</div>
<div class="mt-4">
    <p class="text-muted">
        使用 <code>sb-manager</code> 命令行工具管理更多设置。<br>
        运行 <code>sb-manager help</code> 查看所有命令。
    </p>
</div>
{{end}}
